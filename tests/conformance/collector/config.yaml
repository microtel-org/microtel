#
# Collector configuration for the conformance tier. Started by
# ci/scripts/conformance.sh; the pinned image is recorded in
# docs/interop-matrix.md.
#
# Four named otlp receivers rather than one, each on its own port pair, so a
# test selects a transport-security posture by picking an endpoint instead of
# by restarting the collector with a different config. They all feed the same
# traces pipeline, so a test asserts on one output file whichever port it used.
# Logs and metrics each get a pipeline from the same four receivers, written to
# their own files, so an assertion about one signal can never be satisfied by
# another's line.
#
# Port convention: <base><variant>, base 431x/432x for grpc/http,
#   plain 4317/4318 | tls 4327/4328 | mtls 4337/4338 | auth 4347/4348
#   leaf 4357/4358
#
# otlp/leaf is the leaf / concentrator end-to-end gate's own receiver
# (tests/conformance/leaf/). It feeds a traces pipeline with no processor into
# its own file, so the file exporter writes exactly one line per request it
# receives: the test proves that many leaves left the concentrator as one
# export request (docs/leaf-concentrator-design.md §7.5), which the batch
# processor of the main pipeline could otherwise fake by merging requests.

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  bearertokenauth:
    scheme: "Bearer"
    token: "microtel-conformance-token"

receivers:
  otlp/plain:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  otlp/tls:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4327"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key
      http:
        endpoint: "0.0.0.0:4328"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key

  # Same material as otlp/tls plus a client CA, so a handshake here fails
  # unless the client presents a cert this CA signed.
  otlp/mtls:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4337"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key
          client_ca_file: /certs/ca.crt
      http:
        endpoint: "0.0.0.0:4338"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key
          client_ca_file: /certs/ca.crt

  # grpc is plaintext on purpose: it isolates the Authorization header from TLS
  # so an auth failure cannot be confused with a handshake failure, and h2c
  # works there because gRPC is h2c by definition.
  #
  # http carries the same server TLS material as otlp/tls. Until v1.2.6
  # microtel spoke HTTP/2 only, and the collector's plaintext OTLP/HTTP
  # receiver is HTTP/1.1-only (issue #166), so a plaintext auth port was
  # unreachable for the client under test. The auth tests pin the correct-CA
  # trust first so a 401 stays distinguishable from a handshake failure.
  otlp/auth:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4347"
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: "0.0.0.0:4348"
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key

  # gRPC plaintext, HTTP with the otlp/tls material, for the same reason as
  # otlp/auth: before v1.2.6 microtel could not reach a plaintext
  # HTTP/1.1-only receiver (#166).
  otlp/leaf:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4357"
      http:
        endpoint: "0.0.0.0:4358"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key

processors:
  batch:
    send_batch_size: 512
    timeout: 100ms

exporters:
  # The observable surface for round-trip assertions: one compact protojson
  # object per batch, appended to a bind-mounted file the test reads back.
  file:
    path: /out/traces.jsonl
    flush_interval: 100ms
  file/logs:
    path: /out/logs.jsonl
    flush_interval: 100ms
  file/metrics:
    path: /out/metrics.jsonl
    flush_interval: 100ms
  file/leaf:
    path: /out/leaf-traces.jsonl
    flush_interval: 100ms
  debug:
    verbosity: basic

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp/plain, otlp/tls, otlp/mtls, otlp/auth]
      processors: [batch]
      exporters: [file, debug]
    # No processor: one request in, one line out.
    traces/leaf:
      receivers: [otlp/leaf]
      exporters: [file/leaf]
    logs:
      receivers: [otlp/plain, otlp/tls, otlp/mtls, otlp/auth]
      processors: [batch]
      exporters: [file/logs, debug]
    metrics:
      receivers: [otlp/plain, otlp/tls, otlp/mtls, otlp/auth]
      processors: [batch]
      exporters: [file/metrics, debug]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
