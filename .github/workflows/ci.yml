# microtel CI — header compile check + test tree (M2+).
#
# Verifies every public and internal header compiles standalone with
# -Wall -Wextra -Wpedantic -Werror under both -std=c++20 (the project
# floor) and -std=c++23 (which exercises the std::expected branch of
# the microtel::Expected wrapper per ICP 0002), plus runs the gtest
# smoke test that exercises the headers inside a gtest TU (M2 chunk 2).
#
# Sanitizers, clang-tidy, clang-format, and coverage gates land here
# in M2 chunk 5.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per ref. A new push to a pull request cancels that PR's run in
# progress, and a new merge to master cancels master's: every master commit
# includes the ones before it, so only the newest run needs to finish. Matches
# sonarqube.yml. Without this, each merge queued a full run and superseded runs
# held the 20 concurrent job slots for hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Docs-only PRs skip the heavy jobs below (ci/scripts/classify-change.sh).
  # Their required checks still report: a job skipped by its `if` counts as
  # passing, and the matrix jobs run with every step skipped, so each
  # per-matrix check name still appears. If this job fails, `code` is empty,
  # nothing equals 'false', and every job runs in full. Pushes to master
  # always run everything.
  changes:
    runs-on: ubuntu-latest
    name: changes
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the change
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ci/scripts/classify-change.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          else
            ci/scripts/classify-change.sh
          fi
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: clang-format
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (packages)
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-format-18
      - name: Install clang-format
        timeout-minutes: 20
        run: |
          sudo update-alternatives --install /usr/bin/clang-format \
            clang-format /usr/bin/clang-format-18 100
      - name: Run format-check
        run: ci/scripts/format-check.sh

  tidy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: clang-tidy
    steps:
      # Full history so tidy-check.sh can find the PR's merge-base and lint
      # only the TUs the PR changed (see "Run tidy-check" below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (packages)
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 clang-tidy-18 cmake ninja-build libssl-dev libnghttp2-dev
            zlib1g-dev libgoogle-glog-dev liblog4cxx-dev
      - name: Install toolchain
        timeout-minutes: 20
        run: |
          sudo update-alternatives --install /usr/bin/clang-tidy \
            clang-tidy /usr/bin/clang-tidy-18 100
      # Every optional tree is enabled here so its TUs land in
      # compile_commands.json and are linted with real flags. tidy-check.sh
      # skips (and reports) any TU absent from the build rather than linting it
      # with clang-tidy's fallback flags, which cannot resolve include paths.
      # Before this, the four tests/fuzz TUs were being linted with those
      # fallback flags — they pass either way, but the findings were not
      # trustworthy. FUZZ needs clang for -fsanitize=fuzzer, which this job uses.
      - name: Configure (compile_commands for clang-tidy)
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DMICROTEL_BUILD_HEADER_CHECK=ON \
            -DMICROTEL_BUILD_TESTS=ON \
            -DMICROTEL_BUILD_OTELCPP_SHIM=ON \
            -DMICROTEL_BUILD_GLOG_BRIDGE=ON \
            -DMICROTEL_BUILD_LOG4CXX_BRIDGE=ON \
            -DMICROTEL_BUILD_LEAF=ON \
            -DMICROTEL_LEAF_ENCODER=upb \
            -DMICROTEL_BUILD_FUZZ=ON \
            -DMICROTEL_WITH_CONCENTRATOR=ON
      - name: Build (gtest needs to land before tidy can resolve includes)
        run: cmake --build build --target gtest gtest_main
      # Pull requests lint only the TUs they change (changed mode), falling
      # back to every TU when a header, .clang-tidy, CMake file, this workflow
      # or the script itself changes — see ci/scripts/tidy-check.sh. Pushes to
      # master leave TIDY_BASE empty and lint everything, as does the nightly
      # .github/workflows/tidy-nightly.yml. TUs run in parallel on every core.
      - name: Run tidy-check
        env:
          TIDY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: ci/scripts/tidy-check.sh build

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]
        compiler:
          - { name: gcc,   cc: gcc-13,   cxx: g++-13   }
          - { name: clang, cc: clang-18, cxx: clang++-18 }

    name: cxx${{ matrix.std }} / ${{ matrix.compiler.name }}

    env:
      CC:  ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'

      - name: Install toolchain
        timeout-minutes: 40
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            ${{ matrix.compiler.name == 'gcc' && 'g++-13' || 'clang-18' }} cmake
            ninja-build libssl-dev libnghttp2-dev zlib1g-dev libgoogle-glog-dev
            liblog4cxx-dev libmosquitto-dev

      # libmosquitto-dev is for examples/leaf_mqtt, whose concentrator links
      # it. Without it CMake skips that example with a STATUS line instead of
      # failing, so the package is what keeps the example compiling on every
      # PR. Only the cxx20 / clang cell builds examples; the install step is
      # shared by the matrix.
      #
      # MICROTEL_BUILD_EXAMPLES is ON for exactly one matrix entry — cxx20 /
      # clang — so examples/ cannot rot against the public API without a PR
      # going red. One entry, not four: the examples are plain consumer code
      # and compiling them on every axis buys nothing. This is not a separate
      # required check; it fails inside a job that is already required.
      #
      # It earns its keep: it went green only after fixing basic_trace, which
      # had stopped compiling when microtel::Status grew two enumerators in
      # v1.1 and nothing asked the example to build again.
      # MICROTEL_LEAF_ENCODER: the gcc cells ship a upb leaf, the clang cells the
      # default nanopb one. Either way the test tree builds and runs the leaf
      # tests against both backends (docs/leaf-concentrator-design.md §7.1).
      - name: Configure
        if: needs.changes.outputs.code != 'false'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DMICROTEL_BUILD_HEADER_CHECK=ON \
            -DMICROTEL_BUILD_TESTS=ON \
            -DMICROTEL_BUILD_GLOG_BRIDGE=ON \
            -DMICROTEL_BUILD_LOG4CXX_BRIDGE=ON \
            -DMICROTEL_BUILD_LEAF=ON \
            -DMICROTEL_LEAF_ENCODER=${{ matrix.compiler.name == 'gcc' && 'upb' || 'nanopb' }} \
            -DMICROTEL_WITH_CONCENTRATOR=${{ matrix.std == 20 && 'ON' || 'OFF' }} \
            -DMICROTEL_BUILD_EXAMPLES=${{ (matrix.std == 20 && matrix.compiler.name == 'clang') && 'ON' || 'OFF' }}

      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: cmake --build build --verbose

      - name: Test
        if: needs.changes.outputs.code != 'false'
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]

    name: ${{ matrix.sanitizer }}

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - name: Install toolchain
        timeout-minutes: 40
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
            libgoogle-glog-dev liblog4cxx-dev
      - name: Configure
        if: needs.changes.outputs.code != 'false'
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DMICROTEL_BUILD_HEADER_CHECK=ON \
            -DMICROTEL_BUILD_TESTS=ON \
            -DMICROTEL_BUILD_GLOG_BRIDGE=ON \
            -DMICROTEL_BUILD_LOG4CXX_BRIDGE=ON \
            -DMICROTEL_BUILD_LEAF=ON \
            -DMICROTEL_LEAF_ENCODER=upb \
            -DMICROTEL_WITH_CONCENTRATOR=ON \
            -DMICROTEL_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: cmake --build build --verbose
      - name: Test
        if: needs.changes.outputs.code != 'false'
        env:
          ASAN_OPTIONS:  detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          TSAN_OPTIONS:  halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  regen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: regen-check
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc v29.4 + build plugins (packages)
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            cmake ninja-build g++ git
      - name: Install protoc v29.4 + build plugins
        timeout-minutes: 20
        run: |
          # Download pre-built protoc v29.4 binary
          curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v29.4/protoc-29.4-linux-x86_64.zip \
               -o /tmp/protoc.zip
          unzip -j /tmp/protoc.zip bin/protoc -d /tmp/protoc-bin
          chmod +x /tmp/protoc-bin/protoc
          # Build protoc-gen-upb / protoc-gen-upb_minitable from source
          git clone --depth 1 --branch v29.4 \
            https://github.com/protocolbuffers/protobuf.git /tmp/protobuf
          cd /tmp/protobuf
          git submodule update --init third_party/abseil-cpp
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_CONFORMANCE=OFF \
            -Dprotobuf_BUILD_EXAMPLES=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -Dprotobuf_ABSL_PROVIDER=module
          cmake --build build --target protoc-gen-upb protoc-gen-upb_minitable -j$(nproc)
      # The generator for gen/nanopb/ (the leaf's descriptors), pinned to the
      # release third_party/nanopb/ vendors and run under the python-protobuf
      # that matches protoc 29.4. Developer-time only (ICP 0031 Decision 4).
      - name: Install nanopb generator 0.4.9.2
        run: |
          git clone --depth 1 --branch nanopb-0.4.9.2 \
            https://github.com/nanopb/nanopb.git /tmp/nanopb
          python3 -m venv /tmp/nanopb-venv
          /tmp/nanopb-venv/bin/pip install protobuf==5.29.4
      - name: Regenerate proto accessors
        run: |
          PATH=/tmp/nanopb-venv/bin:$PATH ci/scripts/regen-protos.sh \
            --protoc     /tmp/protoc-bin/protoc \
            --gen-upb    /tmp/protobuf/build/protoc-gen-upb-29.4.0 \
            --gen-upb-mt /tmp/protobuf/build/protoc-gen-upb_minitable-29.4.0 \
            --nanopb-generator /tmp/nanopb/generator/protoc-gen-nanopb
      # `git status` as well as `git diff`: a file the generator newly emits is
      # untracked, and `git diff` does not show it.
      - name: Assert gen/ is up-to-date
        run: |
          if ! git diff --exit-code gen/ || [[ -n "$(git status --porcelain gen/)" ]]; then
            git status --porcelain gen/
            echo ""
            echo "ERROR: gen/ is out of date with proto/."
            echo "Run ci/scripts/regen-protos.sh and commit the result."
            exit 1
          fi

  symbol-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: symbol-scan
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
      # Tests off: the gate asserts the closure of what actually ships, so it
      # must not see gtest/gmock or any other test-only input.
      - name: Configure (shipped configuration)
        env:
          CC:  clang-18
          CXX: clang++-18
        # MICROTEL_BUILD_LEAF=ON with the default MICROTEL_LEAF_ENCODER=nanopb
        # builds the nanopb leaf and its archives, so the nanopb passes and
        # the leaf pass (including its no-heap check) have something to scan.
        run: cmake -S . -B build -G Ninja -DMICROTEL_BUILD_TESTS=OFF -DMICROTEL_BUILD_LEAF=ON
      - name: Build
        run: cmake --build build
      # ICP 0020 Decision 5: "shipped" means the install tree, so the gate
      # scans what `cmake --install` produces rather than the build directory.
      # It also drops libmicrotel_preflight_lib.a from the scan, which is
      # correct — it is tool-only and is not installed.
      - name: Install to a staging prefix
        run: cmake --install build --prefix install-tree
      # --leaf-build: the leaf archives are not installed yet, so they are
      # scanned from the build tree (ICP 0031 Decision 4).
      - name: Assert dependency closure and the vendored-upb and nanopb prefixes
        run: ci/scripts/symbol-scan.sh --prefix install-tree --leaf-build build

  # The leaf's standalone build (docs/leaf-concentrator-design.md §2.1): only a
  # C compiler, no CXX language, no nghttp2 / OpenSSL / zlib. This is the form
  # a firmware toolchain uses, so it must keep configuring on its own, with
  # either backend. The installed archives then go through the same
  # symbol-scan gate, leaf pass included (for nanopb, the no-heap check).
  leaf-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        encoder: [nanopb, upb]
    name: leaf-standalone / ${{ matrix.encoder }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - name: Install toolchain
        timeout-minutes: 40
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            gcc cmake ninja-build binutils
      - name: Configure (C only)
        if: needs.changes.outputs.code != 'false'
        env:
          CC: gcc
        run: cmake -S leaf -B build-leaf -G Ninja -DMICROTEL_LEAF_ENCODER=${{ matrix.encoder }}
      - name: Assert no C++ toolchain was configured
        if: needs.changes.outputs.code != 'false'
        run: |
          if grep -q '^CMAKE_CXX_COMPILER:' build-leaf/CMakeCache.txt; then
            echo "leaf-standalone: the standalone leaf build enabled CXX" >&2
            exit 1
          fi
      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: cmake --build build-leaf
      - name: Install to a staging prefix
        if: needs.changes.outputs.code != 'false'
        run: cmake --install build-leaf --prefix leaf-install
      - name: Assert the leaf's dependency closure
        if: needs.changes.outputs.code != 'false'
        run: ci/scripts/symbol-scan.sh --prefix leaf-install

  # Leaf footprint and closure (docs/leaf-concentrator-design.md §7.6, ICP 0031
  # gate 4): the leaf cross-compiled with each backend for Cortex-M0+ and
  # Cortex-M4 (arm-none-eabi-gcc) and for Linux on aarch64, so the backends
  # compare on the same targets (issue #351). Each links
  # examples/leaf/size_probe.c with --gc-sections and writes the leaf's
  # .text / .rodata / .data / .bss and the worst-case stack of every public
  # entry point (ci/scripts/leaf-stack.py) to the job summary, with an OVER /
  # UNDER line against the flash target (< 15 KB nanopb, < 30 KB upb). The
  # targets are not gates in v1.2: the job fails only if the build, the link,
  # the stack analysis or the closure scan (target nm; nanopb: no heap) fails.
  leaf-footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        target: [cortex-m0plus, cortex-m4, aarch64]
        encoder: [nanopb, upb]
        include:
          - { target: cortex-m0plus, packages: gcc-arm-none-eabi libnewlib-arm-none-eabi }
          - { target: cortex-m4,     packages: gcc-arm-none-eabi libnewlib-arm-none-eabi }
          - { target: aarch64,       packages: gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross }
    name: leaf-footprint / ${{ matrix.target }} / ${{ matrix.encoder }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - name: Install toolchain
        timeout-minutes: 40
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            cmake ninja-build python3 ${{ matrix.packages }}
      - name: Measure and scan
        if: needs.changes.outputs.code != 'false'
        run: ci/scripts/leaf-footprint.sh ${{ matrix.target }} ${{ matrix.encoder }}

  # The leaf's tests on other targets (issue #351, ci/scripts/leaf-target.sh):
  # bare-metal Cortex-M0+ code on QEMU's Cortex-M0 (micro:bit; ARMv6-M, no
  # unaligned access, checked by a control that must fault) and Cortex-M4
  # (MPS2 AN386), running the C runner of tests/leaf/target/ over Arm
  # semihosting; and the full gtest leaf suite plus the runner under
  # qemu-aarch64 and as a 32-bit i686 process. The runner also reports the
  # stack each public entry point used, to the job summary.
  leaf-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: cortex-m0plus, packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm }
          - { target: cortex-m4,     packages: gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm }
          - { target: aarch64,       packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user }
          - { target: i686,          packages: gcc-i686-linux-gnu g++-i686-linux-gnu }
    name: leaf-target / ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - name: Install toolchain
        timeout-minutes: 40
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            cmake ninja-build ${{ matrix.packages }}
      - name: Build and run
        if: needs.changes.outputs.code != 'false'
        run: ci/scripts/leaf-target.sh ${{ matrix.target }}

  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: consumer-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
      # Tests off, matching the symbol-scan job: the gate consumes the shipped
      # configuration, and building the test tree would only slow it down.
      - name: Configure (shipped configuration)
        env:
          CC:  clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja -DMICROTEL_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build
      # ICP 0020 Decision 6. Installs to a scratch prefix, then configures,
      # builds and runs tests/consumer against it as an external project —
      # the only way a missing install(FILES …) or an export set naming an
      # uninstalled target becomes visible. In-tree everything builds because
      # everything is a subdirectory. The script also re-runs the closure scan
      # over the same prefix.
      #
      # One job, default configuration. MICROTEL_USE_SPDLOG=OFF was verified by
      # hand in #193 and changes no exported target — only the self-describing
      # microtel_WITH_SPDLOG variable in the package config — so a matrix axis
      # would buy a second copy of the same assertion.
      - name: Install, build the consumer project against it, and run it
        run: ci/scripts/consumer-smoke.sh build

  # MICROTEL_USE_SYSTEM_DEPS=ON (#378): toml++, spdlog and GoogleTest from the
  # distribution instead of FetchContent, configured fully offline, as a
  # package manager builds it. Ubuntu's libtomlplusplus-dev is a *compiled*
  # toml++ (libtomlplusplus.so + CMake config), so CONSUMER_TOML=1 runs
  # tests/consumer_toml too: an application that links compiled toml++ and
  # microtel (which compiles toml++ header-only) in one process.
  system-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: system-deps
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and system dependencies
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build pkg-config libssl-dev libnghttp2-dev zlib1g-dev
            libtomlplusplus-dev libspdlog-dev libgtest-dev
      - name: Configure (system dependencies, fully offline)
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMICROTEL_USE_SYSTEM_DEPS=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DMICROTEL_BUILD_TESTS=ON
          test ! -d build/_deps
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install, build both consumers against it, and run them
        env:
          CONSUMER_TOML: "1"
        run: ci/scripts/consumer-smoke.sh build

  # The README's Install routes other than `cmake --install`: microtel as a
  # FetchContent subproject, through CPM.cmake, and through the vcpkg overlay
  # port. Each builds and runs tests/consumer/main.cpp against this checkout
  # (ci/scripts/consumer-package.sh). The subproject cells are what catch a
  # CMAKE_SOURCE_DIR that should be PROJECT_SOURCE_DIR, or a default that
  # drags tests into a parent's build.
  consumer-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: consumer-package (${{ matrix.method }})
    strategy:
      fail-fast: false
      matrix:
        method: [fetchcontent, cpm, vcpkg]
    env:
      # The vcpkg commit the overlay port was last verified against.
      VCPKG_COMMIT: bf19794383e8fb95eba5aa553235bc8ec2271688
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build pkg-config libssl-dev libnghttp2-dev zlib1g-dev
      - name: Build and run the consumer (subproject)
        if: matrix.method != 'vcpkg'
        env:
          CC: clang-18
          CXX: clang++-18
        run: ci/scripts/consumer-package.sh ${{ matrix.method }}
      # vcpkg builds OpenSSL and the other dependencies from source, so they
      # come from a binary cache keyed on the vcpkg commit. microtel itself is
      # always rebuilt from this checkout. The runner's default GCC 13 is the
      # compiler vcpkg's own CI uses.
      - name: Fetch vcpkg
        if: matrix.method == 'vcpkg'
        run: |
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: vcpkg binary cache
        if: matrix.method == 'vcpkg'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Build and run the consumer (vcpkg)
        if: matrix.method == 'vcpkg'
        run: VCPKG_ROOT="$RUNNER_TEMP/vcpkg" ci/scripts/consumer-package.sh vcpkg

  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: corpus-check
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
      # libFuzzer is clang-only, hence plain `clang` rather than the clang-18
      # used elsewhere: -fsanitize=fuzzer must match the driver that links it.
      # Tests off — the harnesses are the only targets this job needs.
      # MICROTEL_BUILD_LEAF=ON: leaf_backend_diff_fuzz links both leaf backends.
      - name: Configure fuzz harnesses
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMICROTEL_BUILD_FUZZ=ON \
            -DMICROTEL_BUILD_LEAF=ON \
            -DMICROTEL_BUILD_TESTS=OFF \
            -DMICROTEL_WITH_CONCENTRATOR=ON
      - name: Build
        run: cmake --build build-fuzz
      # Replays committed crashing inputs only. Fuzzing itself stays in the
      # periodic fuzz.yml job; this is the deterministic regression half that
      # tests/fuzz/CMakeLists.txt and tests/fuzz/README.md call a hard gate.
      - name: Replay crash corpus
        run: ci/scripts/corpus-check.sh build-fuzz

  otelcpp-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: otelcpp-shim
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
      # Opt-in build (M17, ICP 0014). Fetches only opentelemetry-cpp's
      # header-only API; its SDK and exporters are never configured.
      - name: Configure with the shim enabled
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build -G Ninja \
            -DMICROTEL_BUILD_OTELCPP_SHIM=ON \
            -DMICROTEL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The shim must not change what microtel ships. Re-running the closure
      # gate with the shim enabled proves it adds no shipped artifact and no
      # forbidden symbol — the claim ICP 0014 §4 makes in prose. Scanning the
      # install tree rather than the build tree is what makes "no shipped
      # artifact" mechanical: ICP 0020 Decision 3 says the shim installs headers
      # and never a binary, and an install tree is where that is observable.
      - name: Install to a staging prefix
        run: cmake --install build --prefix install-tree
      - name: Assert the shim does not alter the dependency closure
        run: ci/scripts/symbol-scan.sh --prefix install-tree

  # The Conan recipe on HEAD, in a container with no system nghttp2, OpenSSL or
  # zlib headers. Every other job installs them into /usr/include, which hides
  # a target that includes a dependency's header without linking it (#473).
  # Not a required check.
  conan-clean:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: conan-clean
    steps:
      # git before checkout, so actions/checkout makes a real clone that
      # conan-clean.sh can `git archive`.
      - name: Install toolchain (no -dev packages for microtel's dependencies)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ make cmake perl python3-venv ca-certificates git
      - uses: actions/checkout@v4
      # The workspace belongs to the runner's uid, not the container's root,
      # so git refuses to `git archive` it without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Conan
        run: |
          python3 -m venv /opt/conan
          /opt/conan/bin/pip install conan
          echo /opt/conan/bin >> "$GITHUB_PATH"
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: /github/home/.conan2/p
          key: conan-clean-${{ hashFiles('packaging/conan/recipes/microtel/all/conanfile.py') }}
      - name: Detect profile
        run: conan profile detect
      - name: conan create on HEAD
        run: ci/scripts/conan-clean.sh

  conformance:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: conformance
    # Pulling the collector image dominates; the tests themselves are seconds.
    # Job timeout sits above the apt-install step's 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 cmake ninja-build libssl-dev libnghttp2-dev zlib1g-dev
      - name: Configure
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_STANDARD=20 \
            -DMICROTEL_BUILD_TESTS=ON \
            -DMICROTEL_BUILD_LEAF=ON \
            -DMICROTEL_WITH_CONCENTRATOR=ON
      - name: Build
        run: cmake --build build
      # The leaf and the concentrator are on so the leaf end-to-end gate
      # (tests/conformance/leaf/, ICP 0031 gates 3 and 5) runs here: both
      # encoder backends, over both protocols, into the collector's otlp/leaf
      # receiver.
      # Docker is preinstalled on the runner; conformance.sh detects podman
      # first and falls back to it. The script starts the pinned collector
      # (docs/interop-matrix.md), waits on its health extension, and fails the
      # job if no test carries the `conformance` label.
      - name: Run conformance gate
        run: ci/scripts/conformance.sh build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: coverage
    steps:
      # Full history: the diff-coverage step below needs origin/master to
      # compute the changed-line set, and a depth-1 checkout has no base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # clang + llvm, not gcc + lcov: the gate measures with clang source-based
      # instrumentation (issue #198) and exports the tracefile with llvm-cov,
      # so nothing here calls gcov or lcov any more.
      #
      # Three versions, pinned for three different reasons — coverage.sh checks
      # all of them and refuses to run on a mismatch:
      #
      #   clang-18         Ubuntu's, the same compiler the `compile` matrix uses.
      #   llvm-profdata-18 must match the compiler exactly: it reads the *raw*
      #                    profiles the instrumented binaries write, and that
      #                    format is locked to the compiler's release in both
      #                    directions (llvm-profdata-21 rejects clang-18's raw
      #                    version 9 outright).
      #   llvm-cov-21      from apt.llvm.org, and it has to be ≥ 21: up to
      #                    llvm-cov 20, `export` emits branch records per
      #                    template instantiation while emitting line records
      #                    already merged across them, so the gate would compare
      #                    a merged line percentage against a per-instantiation
      #                    branch percentage. Issue #236 has the bisect. It
      #                    reads the indexed profile and the coverage mapping,
      #                    both of which a newer reader accepts.
      #
      # This repository is deliberately NOT added to the other building jobs
      # (CLAUDE.md §"Adding new system dependencies to CI" notwithstanding):
      # only `coverage` and sonarqube's `scan` run coverage.sh, and an external
      # package source is worth adding to exactly the jobs that need it.
      # clang-format and clang-tidy stay on their pinned Ubuntu 18 packages.
      - name: Add the LLVM apt repository (llvm-cov 21)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg]" \
               "http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
      - name: Install toolchain
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 llvm-18 llvm-21 cmake ninja-build libssl-dev libnghttp2-dev
            zlib1g-dev libgoogle-glog-dev liblog4cxx-dev
      # coverage.sh enforces all three aggregate floors (docs/ci-architecture.md,
      # `coverage`) — ≥ 90% line
      # and ≥ 85% branch on sdk-encoder, ≥ 80% line on transport-exporter — and
      # fails the job on a shortfall.
      - name: Run coverage script
        env:
          CC:            clang-18
          CXX:           clang++-18
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV:      llvm-cov-21
          # The glog and log4cxx bridges are header-only under include/microtel/,
          # so their lines count toward the sdk-encoder group — build them here.
          # The leaf (leaf/) is gated with the sdk-encoder group. The
          # concentrator is OFF by default but its code is gated too (design §6.2).
          COVERAGE_EXTRA_CMAKE_ARGS: >-
            -DMICROTEL_BUILD_GLOG_BRIDGE=ON -DMICROTEL_BUILD_LOG4CXX_BRIDGE=ON
            -DMICROTEL_BUILD_LEAF=ON -DMICROTEL_LEAF_ENCODER=upb
            -DMICROTEL_WITH_CONCENTRATOR=ON
        run: ci/scripts/coverage.sh build
      # The other half of the coverage gate: every line this PR adds or modifies must be
      # covered by a test in the same PR.
      #
      # The gate states two diff thresholds (CONTRIBUTING.md) — 90% on SDK/encoder, 80% on
      # transport/exporter — but diff-cover takes a single --fail-under. We
      # pick the 80 floor: it is the one that holds everywhere, and the 90 for
      # SDK/encoder is already carried by the aggregate gate above, which is
      # measured per group and does distinguish them. A PR that drags
      # sdk-encoder's aggregate below 90 fails the previous step regardless of
      # what this one says.
      #
      # diff-cover is a pip package used only at test time. It adds nothing to
      # microtel's runtime dependency closure (CLAUDE.md rule 12).
      #
      # `--user` needs no root and `--break-system-packages` satisfies PEP 668
      # on the runner's system Python; invoking the module rather than the
      # console script means the step does not depend on ~/.local/bin being on
      # PATH.
      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install --user --break-system-packages diff-cover
      - name: Diff coverage gate
        if: github.event_name == 'pull_request'
        run: |
          python3 -m diff_cover.diff_cover_tool build/coverage.filtered.info \
            --compare-branch "origin/${{ github.event.pull_request.base.ref }}" \
            --src-roots . \
            --fail-under=80
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            build/coverage.info
            build/coverage.filtered.info
            build/coverage.per-file.tsv
            build/coverage.profdata
          retention-days: 14

  # The TDD test-presence gate (CONTRIBUTING.md; docs/ci-architecture.md,
  # `test-presence`). Separate from `coverage` because
  # it needs a git diff rather than a 10-minute instrumented build: a PR that
  # forgot its tests should hear about it in seconds.
  #
  # Not a required status check yet.
  test-presence:
    runs-on: ubuntu-latest
    name: test-presence
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run test-presence gate
        env:
          # The `[refactor]` escape hatch. Passing the labels through the
          # workflow context keeps the script free of jq and `gh auth`.
          MICROTEL_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ci/scripts/test-presence.sh "origin/${{ github.event.pull_request.base.ref }}"

  # Version-coherence gate. The release version is hand-spelled in CMakeLists.txt,
  # version.hpp, the gRPC user-agent and the preflight tool; this fails a PR in
  # which they stop agreeing. A check, not a generator — docs/releasing.md explains
  # why version.hpp is not derived from PROJECT_VERSION.
  #
  # Needs no toolchain: it reads source text, so it answers in seconds.
  version-drift-check:
    runs-on: ubuntu-latest
    name: version-drift-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every version literal against PROJECT_VERSION
        run: ci/scripts/version-drift-check.sh
      # The gate checking itself: synthetic fixtures for each drift shape, plus
      # the cases where the literal has gone missing or been duplicated and the
      # gate must fail rather than silently pass.
      - name: Self-test the gate
        run: ci/scripts/version-drift-check.sh --self-test

  # ICP 0021. Resolves the `file:symbol` citations attached to LOCKED markers in
  # docs/, and requires an annotation on every marker in a document that
  # declares its citation policy `complete`. Documents and a git checkout are
  # all it needs — no toolchain, no build.
  #
  # The self-test runs first: it proves the gate can fail (stale symbol, missing
  # file, uncited marker) before its PASS on the real tree means anything.
  citation-check:
    runs-on: ubuntu-latest
    name: citation-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the gate
        run: ci/scripts/citation-check.py --self-test
      - name: Resolve LOCKED-marker citations
        run: ci/scripts/citation-check.py
