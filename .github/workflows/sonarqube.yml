# microtel SonarCloud — CI-driven scan, replaces Automatic Analysis.
#
# Per docs/ci-architecture.md §"sonarqube.yml". Automatic Analysis must be
# disabled in the SonarCloud project settings (Administration → Analysis
# Method) so this workflow is the single source of analysis truth — that's
# the only way `sonar.exclusions` in `sonar-project.properties` is
# reliably honored. (Automatic Analysis silently ignores exclusion
# patterns, which produced blocker findings against vendored upb /
# utf8_range code in M3-F1b.)
#
# Required repo secret: `SONAR_TOKEN` (generated under sonarcloud.io →
# Account → Security). Forks do not have access; this workflow no-ops on
# fork PRs rather than failing loudly.
#
# When the secret is missing the job still exits 0 — requiring it would block
# every PR on a maintainer-only setup step — but it is no longer silent. The
# skip writes a heading to the job summary and emits a `::warning::`
# annotation, so "green" and "scanned" cannot be confused by reading the
# checks list. A skipped scan does not discharge the SonarQube gate (no
# blocker/critical issues; docs/ci-architecture.md).

name: sonarqube

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Docs-only PRs have nothing for Sonar to analyse. Not a required check,
    # so skipping the whole workflow cannot leave a PR waiting.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/diagrams/**'
  # Manual trigger. Without it the first scan after SONAR_TOKEN is configured
  # cannot be fired on demand — `gh workflow run` returns HTTP 422 — and the
  # secret's first real exercise would have to wait for the next merge to
  # master.
  workflow_dispatch:

# One in-flight scan per branch is plenty — Sonar matches PR decoration
# by SHA, so cancelling stale runs only saves Sonar API quota.
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true


jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: scan

    # Skip on fork PRs (no SONAR_TOKEN) and when the secret is unset.
    if: >-
      (github.event_name != 'pull_request'
       || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout (full history for blame-based issue dating)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm SONAR_TOKEN is available
        id: token-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "${SONAR_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"

          # A silent green check is worse than no check: it reads as "SonarQube
          # analysed this and found nothing". Say plainly that nothing ran.
          echo "::warning title=NO SONAR SCAN RAN::SONAR_TOKEN is not configured for this repository. No SonarQube analysis was performed — this job is green only because it did nothing. The SonarQube gate is UNMEASURED."

          {
            echo "## :rotating_light: NO SONAR SCAN RAN"
            echo
            echo "\`SONAR_TOKEN\` is not configured, so **no SonarQube analysis was"
            echo "performed** for this commit. This job exits 0 so that master is not"
            echo "blocked on a maintainer-only setup step — it is **not** evidence that"
            echo "the code is clean."
            echo
            echo "The SonarQube gate (\"SonarQube Cloud: no blocker/critical issues\")"
            echo "is **UNMEASURED** until the secret exists."
            echo
            echo "To fix, a maintainer must:"
            echo
            echo "1. Create a SonarCloud org that matches \`sonar.organization\` in"
            echo "   \`sonar-project.properties\` (currently \`microtel-org\`) and import"
            echo "   this GitHub repo so the project key matches \`sonar.projectKey\`"
            echo "   (currently \`microtel-org_microtel\`)."
            echo "2. Create a token at sonarcloud.io → Account → Security."
            echo "3. Add it as the \`SONAR_TOKEN\` repository secret on microtel-org/microtel."
            echo "4. Disable Automatic Analysis in the SonarCloud project settings, so"
            echo "   this workflow is the only analysis path and \`sonar.exclusions\` is"
            echo "   honoured."
            echo "5. Re-run this workflow from the Actions tab (\`workflow_dispatch\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep this list in sync with the building jobs in ci.yml (tidy-check,
      # compile, sanitizers, coverage) — CLAUDE.md §"Adding new system
      # dependencies to CI". The three -dev packages were missing here and the
      # gap stayed invisible for as long as this job skipped for want of
      # SONAR_TOKEN: the moment it ran, CMake failed at
      # `pkg_check_modules(libnghttp2)` before a single file compiled.
      # Mirrors the `coverage` job in ci.yml, because it runs the same script:
      # Ubuntu's clang-18 compiles, apt.llvm.org's llvm-cov 21 exports. See
      # that job's comment and issue #236 for why the exporter version is a
      # correctness requirement and not a preference.
      - name: Add the LLVM apt repository (llvm-cov 21)
        if: steps.token-check.outputs.available == 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg]" \
               "http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
      - name: Install toolchain + llvm coverage tools
        timeout-minutes: 40
        if: steps.token-check.outputs.available == 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang-18 llvm-18 llvm-21 cmake ninja-build libssl-dev libnghttp2-dev
            zlib1g-dev

      # MICROTEL_COVERAGE_ENFORCE=0 because this job wants the tracefile, not a
      # second opinion on the coverage floors. The `coverage` job in ci.yml owns
      # that gate; letting a shortfall abort this job too would suppress the
      # Sonar scan exactly when the code most needs looking at.
      #
      # clang-18, matching the `coverage` job: coverage.sh measures with clang
      # source-based instrumentation (issue #198) and refuses to run under gcc.
      - name: Build under coverage (produces compile_commands.json + lcov)
        if: steps.token-check.outputs.available == 'true'
        env:
          CC:                        clang-18
          CXX:                       clang++-18
          LLVM_PROFDATA:             llvm-profdata-18
          LLVM_COV:                  llvm-cov-21
          MICROTEL_COVERAGE_ENFORCE: "0"
          # Same as the ci.yml coverage job: the concentrator is OFF by default,
          # so build it for SonarQube to see its coverage.
          COVERAGE_EXTRA_CMAKE_ARGS: -DMICROTEL_WITH_CONCENTRATOR=ON
        run: ci/scripts/coverage.sh build/coverage

      # The scanner is handed SonarQube's generic coverage XML, not the lcov
      # tracefile. Feeding lcov to `sonar.cfamily.llvm-cov.reportPath` parsed
      # clean and imported nothing — a silent 0.0% for the whole project
      # (issue #211). The converter also rebases lcov's absolute `SF:` paths to
      # repo-relative, which is what SonarQube indexes files under, and exits
      # non-zero if the conversion yields no coverable line, so this step fails
      # loudly instead of handing the scanner an empty report.
      #
      # --include mirrors `sonar.sources` (src,include): a path SonarQube has
      # not indexed cannot be attached to anything, and emitting one only buys
      # an "unresolved path" warning.
      #
      # The tracefile now carries BRDA records (clang source-based coverage
      # measures real conditions), and the converter still emits lines only —
      # see its header for why that is a separate decision from the CI gate.
      - name: Convert lcov to SonarQube generic coverage XML
        if: steps.token-check.outputs.available == 'true'
        run: |
          ci/scripts/lcov-to-sonar.py \
            --base-dir "${GITHUB_WORKSPACE}" \
            --include src \
            --include include \
            --output build/coverage/sonar-coverage.xml \
            build/coverage/coverage.filtered.info

      - name: SonarCloud scan
        if: steps.token-check.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432  # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Exclusions live in sonar-project.properties; restating the
          # most load-bearing patterns here is a deliberate safety net so
          # a future edit that breaks the .properties file can't quietly
          # rescan vendored code.
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scm.provider=git
            -Dsonar.exclusions=gen/**,**/third_party/**,**/_deps/**,proto/**,build*/**,spike/**,**/_generated/**,**/*.upb.c,**/*.upb.h,**/*.upb_minitable.c,**/*.upb_minitable.h
            -Dsonar.cfamily.compile-commands=build/coverage/compile_commands.json
            -Dsonar.coverageReportPaths=build/coverage/sonar-coverage.xml

      # The positive counterpart of the skip notice, so a reader of the job
      # summary can tell "scanned and clean" from "did nothing and exited 0".
      - name: Record that the scan ran
        if: steps.token-check.outputs.available == 'true'
        run: |
          {
            echo "## SonarQube scan ran"
            echo
            echo "Analysis was submitted to SonarCloud for \`${GITHUB_SHA}\`."
            echo "The Quality Gate result is on the SonarCloud project page and,"
            echo "for pull requests, in the PR decoration comment."
          } >> "$GITHUB_STEP_SUMMARY"
