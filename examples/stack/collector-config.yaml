#
# Collector configuration for the examples stack. Receive OTLP from the
# examples, forward it to Tempo, and log a one-line summary so `compose logs
# otel-collector` shows whether anything arrived.
#
# This is deliberately *not* tests/conformance/collector/config.yaml: that one
# exists to exercise four transport-security postures on eight ports. This one
# exists so a reader's first span shows up in Grafana.

extensions:
  # up.sh polls this before it declares the stack ready.
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  otlp:
    protocols:
      # The default endpoint for every example. Plaintext gRPC is h2c by
      # definition, so microtel reaches it without TLS.
      grpc:
        endpoint: "0.0.0.0:4317"
      # Plaintext, and HTTP/1.1 only: microtel reaches it through its HTTP/1.1
      # fallback, one request at a time. No example uses it; see
      # docs/compatibility-matrix.md §4.
      http:
        endpoint: "0.0.0.0:4318"

  # For examples/leaf's fan-in check (examples/leaf/fan-in-check.sh), and
  # nothing else. It feeds the traces/requests pipeline below, which has no
  # batch processor, so debug/requests logs each export request exactly as it
  # arrived: one entry per request, with every ResourceSpans in it. The batch
  # processor of the main pipeline merges requests, so its log cannot show how
  # many requests an exporter sent. Examples that export to 4317 never reach
  # this pipeline.
  otlp/requests:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4319"

processors:
  # One second, not the 200ms default send delay, so an example that emits a
  # handful of spans and exits still has them batched and forwarded before a
  # reader has finished switching to the browser tab.
  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      # Container-internal hop on the compose network. Nothing crosses a host
      # boundary, so there is no certificate to verify.
      insecure: true

  # `compose logs otel-collector` then shows a line per batch, which is the
  # quickest way to tell "the example never connected" from "Grafana is not
  # showing me what did arrive".
  debug:
    verbosity: normal

  # Every Resource attribute of every request on otlp/requests.
  debug/requests:
    verbosity: detailed

  # Every field of every log record, trace and span IDs included, for
  # examples/logs. `normal` prints only body and attributes, no severity or IDs.
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    # No processors: one request in is one debug/requests entry out. The
    # spans still go on to Tempo.
    traces/requests:
      receivers: [otlp/requests]
      exporters: [otlp/tempo, debug/requests]
    # For examples/logs. The stack has no log store, so log records go to the
    # collector's own output and nowhere else: `compose logs otel-collector`
    # shows each record's body, severity, attributes and trace/span IDs.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/logs]
