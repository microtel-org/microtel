extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
        # TLS so HTTP/2 is negotiated via ALPN: this receiver serves only
        # HTTP/1.1 on plaintext, where microtel OTLP/HTTP falls back to serial
        # HTTP/1.1 (docs/interop-matrix.md section 4).  The driver generates
        # this material and bind-mounts it at /certs (bench/driver/tls_material.py).
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key

processors:
  batch:
    send_batch_size: 4096
    timeout: 200ms

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    # `metrics.address` was removed from the collector (deprecated since
    # v0.111); with it present v0.160 rejects the config and exits at startup,
    # so the health check never comes up.  Use the readers form instead.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
