# Jaeger v2 config for the interop job (bench/scripts/jaeger_interop.py).
#
# Jaeger v2 is built on the OpenTelemetry Collector and takes a collector-style
# config.  OTLP/HTTP is served over TLS so that it is HTTP/2: a plaintext
# collector-style HTTP receiver speaks only HTTP/1.1, where microtel falls back
# to serial HTTP/1.1 (docs/interop-matrix.md section 4).  The script generates the certs
# (bench/driver/tls_material.py) and bind-mounts them at /certs.
#
# Endpoints are bound to 0.0.0.0 explicitly: collector components default to
# localhost, which is unreachable through a published container port.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "0.0.0.0:13133"

  jaeger_query:
    storage:
      traces: memstore
    http:
      endpoint: "0.0.0.0:16686"
    grpc:
      endpoint: "0.0.0.0:16685"

  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
