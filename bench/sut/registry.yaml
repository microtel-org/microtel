schema_version: 1
# SUT registry — one entry per system-under-test.
# The bench driver reads this file to know what to build and run.
#
# Fields:
#   name         Short identifier; used as the Docker image name suffix.
#   description  Human-readable label shown in reports and environment fingerprint.
#   dockerfile   Path to Dockerfile, relative to repo root.
#   image_name   Passed to: docker build -t <image_name>
#   protocol     Transport to the sink (grpc | http).
#   ports:
#     control    TCP port the emit-app listens on for driver control messages
#                (start / stop / flush / report).
#   env          Env vars the driver injects at `docker run` time.
#                Empty strings are placeholders; the driver fills them in.
#   b0           true = included in B0 runs; false = deferred to B1+.

suts:
  - name: microtel
    description: "microtel SDK — OTLP/HTTP-protobuf exporter"
    dockerfile: bench/sut/microtel/Dockerfile
    image_name: bench-sut-microtel
    protocol: http
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink-host:4318
    b0: true

  - name: microtel-grpc
    description: "microtel SDK — OTLP/gRPC-over-nghttp2 exporter"
    dockerfile: bench/sut/microtel-grpc/Dockerfile
    image_name: bench-sut-microtel-grpc
    protocol: grpc
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink:4317
    b0: true

  - name: microtel-gzip
    description: "microtel SDK — OTLP/HTTP-protobuf exporter with gzip compression"
    dockerfile: bench/sut/microtel/Dockerfile
    image_name: bench-sut-microtel
    protocol: http
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      EMIT_COMPRESSION_GZIP: "1"
    b0: true

  - name: microtel-grpc-gzip
    description: "microtel SDK — OTLP/gRPC exporter with gzip compression"
    dockerfile: bench/sut/microtel-grpc/Dockerfile
    image_name: bench-sut-microtel-grpc
    protocol: grpc
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      EMIT_COMPRESSION_GZIP: "1"
    b0: true

  # Only the leaf-fanin profile lists it (docs/leaf-concentrator-design.md §7.9).
  - name: microtel-concentrator
    description: "microtel concentrator — leaf payloads through LeafReceiver, OTLP/gRPC exporter"
    dockerfile: bench/sut/microtel-concentrator/Dockerfile
    image_name: bench-sut-microtel-concentrator
    protocol: grpc
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink:4317
    b0: true

  - name: otelcpp-grpc
    description: "opentelemetry-cpp v1.19.0 — OTLP/gRPC exporter"
    dockerfile: bench/sut/otelcpp-grpc/Dockerfile
    image_name: bench-sut-otelcpp-grpc
    protocol: grpc
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to grpc://sink-host:4317
    b0: true

  - name: otelcpp-http
    description: "opentelemetry-cpp v1.19.0 — OTLP/HTTP-protobuf exporter"
    dockerfile: bench/sut/otelcpp-http/Dockerfile
    image_name: bench-sut-otelcpp-http
    protocol: http
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink:4318
    b0: true

  # The emit-app with no SDK (BENCH_BACKEND=NOOP): the harness's own CPU,
  # which the report subtracts from the other SUTs' (bench/docs/methodology.md).
  # Exports nothing; protocol is a placeholder.
  - name: baseline-noop
    description: "emit-app with tracing disabled — no SDK, same workload and pacing loop"
    dockerfile: bench/sut/baseline-noop/Dockerfile
    image_name: bench-sut-baseline-noop
    protocol: http
    ports:
      control: 19090
    b0: true

  - name: go-otel
    description: "go.opentelemetry.io/otel v1.28.0 — OTLP/HTTP exporter"
    dockerfile: bench/sut/go-otel/Dockerfile
    image_name: bench-sut-go-otel
    protocol: http
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink:4318
    b0: true

  - name: rust-otel
    description: "opentelemetry-rust v0.27 — OTLP/HTTP exporter"
    dockerfile: bench/sut/rust-otel/Dockerfile
    image_name: bench-sut-rust-otel
    protocol: http
    ports:
      control: 19090
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""  # driver sets to http://sink:4318
    b0: false
